name: ML production
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ml-production
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r hotspot_forecasting/requirements.txt -r vrp_service/requirements.txt
      - run: python -m unittest discover -s hotspot_forecasting -p 'test_*.py'
      - run: python -m unittest discover -s vrp_service -p 'test_*.py'
      - run: python -m unittest discover -s image_validation -p test_lambda_handler.py
      - run: python -m unittest discover -s scripts -p 'test_*.py'
  images:
    needs: verify
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: forecasting
            context: hotspot_forecasting
            repository: hotspot-forecasting
          - service: vrp
            context: vrp_service
            repository: ecopin-vrp-service
          - service: image-validation
            context: image_validation
            repository: clip-validation-lambda
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        env:
          CONTEXT: ${{ matrix.context }}
        run: |
          for attempt in 1 2 3; do
            if docker buildx build --platform linux/amd64 --provenance=false --load -t service:test "$CONTEXT"; then exit 0; fi
            sleep 15
          done
          exit 1
      - name: Smoke test container
        env:
          SERVICE: ${{ matrix.service }}
        run: python scripts/smoke_container.py "$SERVICE"
      - uses: aws-actions/configure-aws-credentials@v4
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          role-to-assume: arn:aws:iam::035074951255:role/ecopin-ml-github-deploy
          aws-region: ap-southeast-1
      - name: Push and deploy verified image
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          REPOSITORY: ${{ matrix.repository }}
          SERVICE: ${{ matrix.service }}
          RELEASE: ${{ github.sha }}
        run: |
          set -euo pipefail
          registry=035074951255.dkr.ecr.ap-southeast-1.amazonaws.com
          aws ecr get-login-password --region ap-southeast-1 | docker login --username AWS --password-stdin "$registry"
          image="$registry/$REPOSITORY:$RELEASE"
          docker tag service:test "$image"
          docker push "$image"
          digest=$(aws ecr describe-images --region ap-southeast-1 --repository-name "$REPOSITORY" \
            --image-ids "imageTag=$RELEASE" --query 'imageDetails[0].imageDigest' --output text)
          python scripts/deploy_lambda.py "$SERVICE" "$registry/$REPOSITORY@$digest"
